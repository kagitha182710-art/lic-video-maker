<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Video Maker - Pro Secured</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f5; padding: 10px; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        .container { max-width: 450px; margin: auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        canvas { border: 2px solid #ccc; border-radius: 10px; background: #000; width: 100%; height: auto; display: block; margin: auto; }
        .status-box { padding: 10px; margin-bottom: 10px; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .success { background: #d4edda; color: #155724; }
        .loading { background: #fff3cd; color: #856404; }
        .recording { background: #ffeeba; color: #d39e00; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px; }
        #startBtn { background: #004aad; color: #fff; }
        #stopBtn { background: #d93025; color: #fff; }
        #downloadBtn { background: #1e8e3e; color: #fff; display: none; text-decoration: none; padding: 12px 24px; border-radius: 8px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div id="status" class="status-box loading">సెక్యూర్ మోడ్‌లో లోడ్ అవుతోంది...</div>
    <canvas id="canvas"></canvas>
    <div style="margin-top:15px;">
        <button id="startBtn" disabled>▶ రికార్డింగ్ ప్రారంభించండి</button>
        <button id="stopBtn" disabled>⏹ ఆపు</button>
        <br><br>
        <a id="downloadBtn" href="#">📥 ఫైనల్ వీడియో డౌన్‌లోడ్</a>
    </div>
</div>

<video id="vPlayer" style="display:none;" playsinline crossorigin="anonymous"></video>

<script>
    const v = document.getElementById('vPlayer');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let fixedImg = new Image();
    let scrollImg = new Image();
    let borderImg = new Image();
    let recorder, chunks = [], scrollY = 0;
    
    // మెయిన్ వీడియో సోర్స్
    let mainSrc = "https://kagitha182710-art.github.io/lic-video-maker/today.mp4?v=" + Date.now();
    let borderSrc = "TRASPARENT BACKROUND.png"; 
    let outroSrc = "";
    
    let isOutro = false, audioCtx, dest, source, isScrolling = false;

    const sheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReHcj4b9ZAKFQxhMyXFZ_sQQsQHYlyhuPpxr1FmwGXsGRuFhcyUTcP3SeIsmLL04fXfS56feC3Hsoq/pub?gid=0&single=true&output=csv";
    const agentMobile = "9959041086";

    async function loadData() {
        try {
            const r = await fetch(sheet + "&cb=" + Date.now());
            const text = await r.text();
            const rows = text.split("\n");
            let fSrc = "", sSrc = "";
            for (let i = 0; i < rows.length; i++) {
                let cols = rows[i].split(",");
                if (cols[0] && cols[0].trim().includes(agentMobile)) {
                    fSrc = cols[1]?.trim(); 
                    outroSrc = cols[2]?.trim(); 
                    sSrc = cols[3]?.trim(); 
                    break;
                }
            }

            let loadPromises = [];
            loadPromises.push(new Promise(res => { borderImg.onload = res; borderImg.src = borderSrc; }));
            if (fSrc) loadPromises.push(new Promise(res => { fixedImg.crossOrigin="anonymous"; fixedImg.onload = res; fixedImg.src = fSrc; }));
            if (sSrc) loadPromises.push(new Promise(res => { scrollImg.crossOrigin="anonymous"; scrollImg.onload = res; scrollImg.src = sSrc; }));

            await Promise.all(loadPromises);
            v.src = mainSrc;
            v.load(); 
        } catch (e) { status.innerText = "డేటా లోడ్ అవ్వలేదు!"; }
    }

    loadData();

    v.onloadeddata = () => {
        canvas.width = v.videoWidth;
        canvas.height = v.videoHeight;
        render();
        status.className = "status-box success";
        status.innerText = "ప్రొటెక్షన్ ఆన్! రికార్డింగ్ చేయండి.";
        startBtn.disabled = false;
    };

    function render() {
        let w = canvas.width;
        let h = canvas.height;

        ctx.drawImage(v, 0, 0, w, h);

        if (scrollImg.src && isScrolling) {
            ctx.save();
            ctx.globalAlpha = 0.20; 
            let sH = (scrollImg.height / scrollImg.width) * w;
            ctx.drawImage(scrollImg, 0, scrollY, w, sH);
            
            // 55 సెకన్లకు సరిపోయేలా స్లో స్పీడ్
            if (scrollY + sH > -50) { scrollY -= 0.4; } 
            ctx.restore();
        }

        if (fixedImg.src) {
            let targetWidth = w * 0.95; 
            let fH = ((fixedImg.height / fixedImg.width) * targetWidth) * 0.85; // హైట్ తగ్గింపు
            let xOffset = (w - targetWidth) / 2; 
            let yOffset = 20; 
            
            ctx.drawImage(fixedImg, xOffset, h - fH - yOffset, targetWidth, fH);
        }

        if (borderImg.complete) {
            ctx.drawImage(borderImg, 0, 0, w, h);
        }
    }

    function loop() {
        if (!v.paused && !v.ended) {
            render();
            requestAnimationFrame(loop);
        }
    }

    v.addEventListener('play', loop);

    startBtn.onclick = async () => {
        try {
            startBtn.disabled = true;
            status.className = "status-box recording";
            status.innerText = "వీడియో రికార్డ్ అవుతోంది...";

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                dest = audioCtx.createMediaStreamDestination();
                source = audioCtx.createMediaElementSource(v);
                source.connect(dest);
                source.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            chunks = []; 
            scrollY = canvas.height - 150; 
            isScrolling = true;
            isOutro = false;
            
            v.currentTime = 0; 
            await v.play(); 

            const stream = canvas.captureStream(30);
            const combined = new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]);

            recorder = new MediaRecorder(combined, { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 2500000 });
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                downloadBtn.href = URL.createObjectURL(blob);
                downloadBtn.download = "LIC_Final_Output.webm";
                downloadBtn.style.display = "inline-block";
                status.innerText = "వీడియో సిద్ధమైంది!";
            };

            recorder.start();
            stopBtn.disabled = false;
        } catch (e) { alert(e.message); }
    };

    v.onended = () => {
        if (!isOutro && outroSrc) {
            isOutro = true;
            v.src = outroSrc;
            v.play();
        } else { stopBtn.click(); }
    };

    stopBtn.onclick = () => {
        v.pause(); isScrolling = false;
        if (recorder && recorder.state !== "inactive") recorder.stop();
        startBtn.disabled = false; stopBtn.disabled = true;
    };

    // --- సెక్యూరిటీ కోడ్ (Code Protection) ---
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };
    console.log("%cఆగండి! ఇక్కడ కోడ్ కాపీ చేయడం నిషేధించబడింది.", "color: red; font-size: 20px; font-weight: bold;");
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Video Editor - Auto Login Version</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 20px; background-color: #f4f4f9;}
        canvas { border: 2px solid #333; border-radius: 8px; margin-top: 15px; background-color: #000; max-width: 100%; max-height: 60vh; object-fit: contain;}
        .controls { margin-top: 20px; }
        button { padding: 12px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold;}
        button:disabled { background: #ccc; cursor: not-allowed; }
        #downloadBtn { background: #28a745; display: none; }
        .user-info { color: #004aad; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>LIC వీడియో ఎడిటర్</h2>
    <div id="userDisplay" class="user-info"></div>

    <canvas id="canvas"></canvas><br>

    <div class="controls">
        <button id="startBtn">▶ వీడియో రికార్డింగ్ ప్రారంభించండి</button>
        <button id="stopBtn" disabled>⏹ రికార్డింగ్ ఆపివేయి</button>
        <button id="downloadBtn">📥 వీడియో డౌన్‌లోడ్ చేయండి</button>
    </div>

    <!-- ఇక్కడ మీ మెయిన్ వీడియో ఉండాలి -->
    <video id="video" src="video.mp4" style="display: none;" crossorigin="anonymous"></video>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let watermarkImage = new Image();
        let mediaRecorder;
        let recordedChunks = [];
        let watermarkScrollY = 0;
        let isScrolling = false;
        let finalVideoUrl = null;

        // 1. యూజర్ లాగిన్ నంబర్ పొందడం (దీన్ని మీరు మీ లాగిన్ సిస్టమ్ నుండి పంపాలి)
        // ఉదాహరణకు మనం '8341306663' అనుకుందాం
        const userMobile = "8341306663"; 
        document.getElementById('userDisplay').innerText = "లాగిన్ మొబైల్: " + userMobile;

        // 2. మొబైల్ నంబర్ ఆధారంగా ఇమేజ్ లోడ్ చేయడం
        // మీ ఇమేజెస్ అన్నీ ఒకే ఫోల్డర్ లో ఉండాలి. ఉదాహరణకు: images/8341306663.jpg
        watermarkImage.src = "images/" + userMobile + ".jpg"; 
        watermarkImage.crossOrigin = "anonymous";

        watermarkImage.onload = () => {
            console.log("యూజర్ ఇమేజ్ లోడ్ అయింది.");
            watermarkScrollY = canvas.height;
        };

        watermarkImage.onerror = () => {
            alert("క్షమించండి! మీ మొబైల్ నంబర్‌కు సంబంధించిన బ్యానర్ లభించలేదు.");
        };

        video.addEventListener('loadedmetadata', function() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            watermarkScrollY = canvas.height;
        });

        function drawWatermark() {
            if (watermarkImage.complete) {
                let wWidth = canvas.width * 0.98; 
                let wHeight = (watermarkImage.height / watermarkImage.width) * wWidth;
                let xPos = (canvas.width - wWidth) / 2;

                ctx.drawImage(watermarkImage, xPos, watermarkScrollY, wWidth, wHeight);
                
                if (isScrolling) {
                    watermarkScrollY -= 2.0; 
                    if (watermarkScrollY + wHeight < 0) {
                        watermarkScrollY = canvas.height;
                    }
                }
            }
        }

        function draw() {
            if (video.paused || video.ended) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            drawWatermark();
            requestAnimationFrame(draw);
        }

        startBtn.addEventListener('click', () => {
            recordedChunks = [];
            if (finalVideoUrl) URL.revokeObjectURL(finalVideoUrl);
            finalVideoUrl = null;
            downloadBtn.style.display = "none";
            
            isScrolling = true;
            video.play();
            draw();

            const canvasStream = canvas.captureStream(30);
            let videoStream = video.captureStream ? video.captureStream() : video.mozCaptureStream();

            if (videoStream && videoStream.getAudioTracks().length > 0) {
                canvasStream.addTrack(videoStream.getAudioTracks()[0]);
            }

            mediaRecorder = new MediaRecorder(canvasStream, { 
                mimeType: 'video/webm;codecs=vp8',
                videoBitsPerSecond: 5000000 
            });

            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                finalVideoUrl = URL.createObjectURL(blob);
                downloadBtn.style.display = "inline-block"; 
            };

            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
        });

        stopBtn.addEventListener('click', () => {
            video.pause();
            isScrolling = false;
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });

        downloadBtn.addEventListener('click', () => {
            if (finalVideoUrl) {
                const a = document.createElement('a');
                a.href = finalVideoUrl;
                a.download = 'LIC_Agent_Video.webm';
                a.click();
            }
        });

        video.addEventListener('ended', () => { if(!stopBtn.disabled) stopBtn.click(); });
    </script>
</body>
</html>

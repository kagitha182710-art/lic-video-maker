<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Video Maker - Premium Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&family=Anek+Telugu:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', 'Anek Telugu', sans-serif; text-align: center; background: #eef2f7; padding: 10px; -webkit-user-select: none; user-select: none; margin: 0; }
        
        /* ⭐️ 1. కొత్త ప్రీమియం లాగిన్ స్క్రీన్ డిజైన్ ⭐️ */
        #loginWrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #001a33 0%, #004080 100%);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .premium-login-card {
            background: #ffffff;
            padding: 40px 30px; border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 400px; width: 85%;
            text-align: center;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .premium-login-card img.logo {
            max-width: 130px; border-radius: 15px; margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); object-fit: cover;
        }
        .premium-login-card h3 {
            color: #001a33; font-size: 26px; font-weight: 900; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 1px;
        }
        .premium-login-card h3 span { color: #ffcc00; }
        .premium-login-card p { color: #666; font-size: 14px; font-weight: 600; margin-bottom: 25px; }
        
        .premium-input {
            width: 100%; padding: 18px; margin-bottom: 20px;
            border-radius: 12px; border: 2px solid #eef0f3; background: #f8f9fa;
            font-size: 18px; text-align: center; font-weight: 800; letter-spacing: 2px;
            color: #001a33; outline: none; box-sizing: border-box; transition: 0.3s;
        }
        .premium-input:focus { border-color: #004aad; background: #fff; box-shadow: 0 0 15px rgba(0, 74, 173, 0.15); }
        
        .premium-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #ff9900, #ffcc00);
            color: #001a33; border: none; border-radius: 12px;
            font-size: 18px; font-weight: 900; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(255, 204, 0, 0.4); transition: 0.3s;
        }
        .premium-btn:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(255, 204, 0, 0.4); }

        /* ⭐️ 2. వీడియో మేకర్ స్టైల్స్ (లోపల) ⭐️ */
        .container { max-width: 450px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: none; }
        .video-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; max-height: 150px; overflow-y: auto; padding: 10px; border: 1px solid #ddd; border-radius: 10px; }
        .v-btn { padding: 10px 5px; font-size: 12px; background: #eef2f7; border: 1px solid #004aad; border-radius: 8px; cursor: pointer; font-weight: bold; color: #004aad; transition: 0.3s;}
        .v-btn.active { background: #004aad; color: #fff; box-shadow: 0 4px 10px rgba(0, 74, 173, 0.3);}
        
        canvas { border: 2px solid #ccc; border-radius: 10px; background: #fff; width: 100%; height: auto; display: block; margin: auto; }
        .status-box { padding: 10px; margin-bottom: 10px; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .success { background: #d4edda; color: #155724; }
        
        #startBtn { background: #004aad; color: #fff; padding: 12px 20px; border:none; border-radius: 8px; font-weight:bold; cursor:pointer;}
        #stopBtn { background: #d93025; color: #fff; padding: 12px 20px; border:none; border-radius: 8px; font-weight:bold; cursor:pointer;}
        #downloadBtn { background: #1e8e3e; color: #fff; display: none; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight:bold;}
        
        .instruction-text { font-size: 12px; color: #d93025; margin-top: 12px; font-weight: 700; line-height: 1.4; background: #fce8e6; padding: 8px; border-radius: 6px; border: 1px dashed #d93025;}
    </style>
</head>
<body oncontextmenu="return false;">

<div id="loginWrapper">
    <div class="premium-login-card">
        
        <img src="https://i.ibb.co/0j0NQ09L/palleturi.png" class="logo" alt="My Logo">

        <h3><span>VIP</span> వీడియో మేకర్</h3>
        <p>మీ రిజిస్టర్డ్ మొబైల్ నంబర్ ఎంటర్ చేయండి</p>
        
        <input type="tel" id="mobileInput" class="premium-input" placeholder="XXXXXXXXX" maxlength="10">
        <button id="loginBtn" class="premium-btn" onclick="checkUser()">లాగిన్ 🚀</button>
        <div id="loginStatus" style="margin-top:18px; font-size:14px; font-weight:bold;"></div>
    </div>
</div>

<div class="container" id="makerSection">
    <h4 id="welcomeTxt" style="color:#004aad; margin-top:0; margin-bottom:5px; font-size:20px;"></h4>
    <p id="validityTxt" style="color: #d32f2f; font-size: 13px; font-weight: bold; margin-top: 0; margin-bottom: 15px; background: #fff9e6; padding: 5px 15px; border-radius: 20px; border: 1px solid #ffcc00; display: inline-block;"></p>
    
    <div class="video-grid">
        <button class="v-btn active" onclick="changeVideo('video1.mp4', this)">వీడియో 1</button>
        <button class="v-btn" onclick="changeVideo('video2.mp4', this)">వీడియో 2</button>
        <button class="v-btn" onclick="changeVideo('video3.mp4', this)">వీడియో 3</button>
        <button class="v-btn" onclick="changeVideo('video4.mp4', this)">వీడియో 4</button>
    </div>

    <div id="status" class="status-box success">వీడియో సిద్ధంగా ఉంది!</div>
    <canvas id="canvas"></canvas>
    
    <div style="margin-top:15px; display:flex; justify-content:center; gap:10px;">
        <button id="startBtn">▶ జనరేట్ </button>
        <button id="stopBtn" disabled>⏹ ఆపు</button>
    </div>
    
    <div class="instruction-text">
        గమనిక: వీడియో రికార్డింగ్ పూర్తిగా అయిన తర్వాతే కింద డౌన్‌లోడ్ ఆప్షన్ కనబడుతుంది.
    </div>
    
    <div style="margin-top:15px;">
        <a id="downloadBtn" href="#">📥 వీడియో డౌన్‌లోడ్</a>
    </div>
</div>

<video id="vPlayer" style="display:none;" playsinline crossorigin="anonymous"></video>

<script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReHcj4b9ZAKFQxhMyXFZ_sQQsQHYlyhuPpxr1FmwGXsGRuFhcyUTcP3SeIsmLL04fXfS56feC3Hsoq/pub?gid=0&single=true&output=csv";
    
    let agentMob = "", waterName = "", fixedImg = new Image(), borderImg = new Image();
    let borderSrc = "TRASPARENT BACKROUND.png", outroSrc = "";
    let lastUpdate = 0, nameX, nameY, mobX, mobY;
    let isOutro = false; 

    // ⭐️ ఆడియో బగ్‌ను ఫిక్స్ చేయడానికి గ్లోబల్ వేరియబుల్స్ ⭐️
    let audioCtx, dest, source;
    let recorder, chunks = [];

    function formatDate(rawDate) {
        if(!rawDate || rawDate.trim() === "") return "Lifetime Free";
        let parts = rawDate.split(/[-/ \T]/); 
        if (parts.length >= 3 && parts[0].length === 4) {
            return parts[2].substring(0,2) + "-" + parts[1] + "-" + parts[0];
        }
        return rawDate; 
    }

    function isPlanExpired(rawDate) {
        if (!rawDate || rawDate.trim() === "" || rawDate.toLowerCase() === "lifetime free") return false;

        let parts = rawDate.split(/[-/ \T]/);
        if (parts.length >= 3) {
            let expiryDate;
            if (parts[0].length === 4) {
                expiryDate = new Date(parts[0], parts[1] - 1, parts[2]);
            } else {
                expiryDate = new Date(parts[2], parts[1] - 1, parts[0]);
            }
            let today = new Date();
            return today > expiryDate; 
        }
        return false;
    }

    async function checkUser() {
        const input = document.getElementById('mobileInput').value.trim();
        const logStat = document.getElementById('loginStatus');
        
        if (input.length !== 10) {
            logStat.style.color = "red";
            logStat.innerText = "దయచేసి 10 అంకెల నంబర్ ఇవ్వండి!";
            return;
        }

        logStat.style.color = "orange";
        logStat.innerText = "తనిఖీ చేస్తున్నాము... ⏳";

        try {
            const r = await fetch(sheetURL + "&cb=" + Date.now());
            const text = await r.text();
            const rows = text.split("\n");
            let userFound = false;
            let finalValidity = "Lifetime Free"; 
            let planExpired = false;

            for (let i = 0; i < rows.length; i++) {
                let cols = rows[i].split(",");
                if (cols[0] && cols[0].trim() === input) {
                    agentMob = cols[0].trim();
                    waterName = cols[4]?.trim() || "LIC Agent"; 
                    
                    let rawDate = cols[5]?.trim() || "";
                    finalValidity = formatDate(rawDate);
                    planExpired = isPlanExpired(rawDate);
                    
                    let fSrc = cols[1]?.trim();
                    outroSrc = cols[2]?.trim();
                    
                    borderImg.src = borderSrc;
                    if (fSrc) {
                        fixedImg.crossOrigin = "anonymous";
                        fixedImg.src = fSrc;
                    }
                    
                    userFound = true;
                    break;
                }
            }

            if (userFound) {
                if (planExpired) {
                    logStat.style.color = "red";
                    logStat.innerHTML = "మీ ప్లాన్ వాలిడిటీ ముగిసింది.<br><br><span style='color:#004aad;'>పేమెంట్ పేజీ ఓపెన్ అవుతోంది... ⚡</span>";
                    
                    setTimeout(() => {
                        let paymentPageUrl = "https://mylicprofile.com/payment.html?mob=" + input;
                        if (typeof window.AppInventor !== "undefined") {
                            window.AppInventor.setWebViewString("openbrowser|||" + paymentPageUrl);
                        } else {
                            window.location.href = paymentPageUrl;
                        }
                    }, 2500);
                } else {
                    document.getElementById('loginWrapper').style.display = "none";
                    document.getElementById('makerSection').style.display = "block";
                    document.getElementById('welcomeTxt').innerText = "స్వాగతం, " + waterName;
                    document.getElementById('validityTxt').innerText = "Plan Valid Till: " + finalValidity;
                    initVideo();
                }
            } else {
                logStat.style.color = "red";
                logStat.innerHTML = "క్షమించండి! ఈ నంబర్ మా వద్ద లేదు.<br><br><span style='color:#004aad;'>పేమెంట్ పేజీ ఓపెన్ అవుతోంది... ⚡</span>";
                
                setTimeout(() => {
                    let paymentPageUrl = "https://mylicprofile.com/payment.html?mob=" + input;
                    if (typeof window.AppInventor !== "undefined") {
                        window.AppInventor.setWebViewString("openbrowser|||" + paymentPageUrl);
                    } else {
                        window.location.href = paymentPageUrl;
                    }
                }, 2500); 
            }
        } catch (e) { logStat.innerText = "సర్వర్ సమస్య!"; }
    }

    const v = document.getElementById('vPlayer');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    function initVideo() {
        isOutro = false; 
        v.src = "video1.mp4?v=" + Date.now();
        v.load();
    }

    v.onloadedmetadata = () => { canvas.width = v.videoWidth; canvas.height = v.videoHeight; };
    v.onloadeddata = () => render();

    v.onended = () => {
        if (!isOutro && outroSrc) {
            isOutro = true;
            v.src = outroSrc;
            v.load();
            v.play();
        } else {
            if (recorder && recorder.state !== "inactive") {
                stopBtn.click();
            }
        }
    };

    function render() {
        let w = canvas.width, h = canvas.height;
        ctx.drawImage(v, 0, 0, w, h);

        if (!v.paused && !v.ended) {
            let now = Date.now();
            if (now - lastUpdate > 4000) {
                nameX = Math.random() * (w - 200) + 30; nameY = Math.random() * (h/2 - 100) + 100;
                mobX = Math.random() * (w - 200) + 30; mobY = Math.random() * (h/2 - 100) + (h/2);
                lastUpdate = now;
            }
            ctx.save(); ctx.globalAlpha = 0.5; ctx.shadowBlur = 4; ctx.shadowColor = "black";
            ctx.font = "bold 24px Segoe UI"; ctx.fillStyle = "#FFD700";
            ctx.fillText("👤", nameX - 30, nameY); ctx.fillStyle = "white"; ctx.fillText(waterName, nameX, nameY);
            ctx.font = "bold 22px Segoe UI"; ctx.fillStyle = "#25D366";
            ctx.fillText("📞", mobX - 30, mobY); ctx.fillStyle = "white"; ctx.fillText(agentMob, mobX, mobY);
            ctx.restore();
        }

        if (fixedImg.complete) {
            let tw = w * 0.95, fh = ((fixedImg.height / fixedImg.width) * tw) * 0.85;
            ctx.drawImage(fixedImg, (w - tw) / 2, h - fh - 20, tw, fh);
        }
        if (borderImg.complete) ctx.drawImage(borderImg, 0, 0, w, h);
    }

    function loop() { if (!v.paused && !v.ended) { render(); requestAnimationFrame(loop); } }
    v.addEventListener('play', loop);

    // ⭐️ వీడియో మార్చినప్పుడు పాతవి క్లియర్ చేసే లాజిక్ ⭐️
    function changeVideo(src, btn) {
        if (recorder && recorder.state !== "inactive") {
            recorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }
        
        document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        isOutro = false; 
        
        // డౌన్‌లోడ్ బటన్‌ని హైడ్ చేయడం
        downloadBtn.style.display = "none";
        
        v.src = src + "?v=" + Date.now();
        v.load();
    }

    startBtn.onclick = async () => {
        startBtn.disabled = true; stopBtn.disabled = false;
        downloadBtn.style.display = "none"; // బటన్ హైడ్ అవుతుంది
        
        // ⭐️ ఆడియో బగ్ రాకుండా ఒకేసారి క్రియేట్ అయ్యే లాజిక్ ⭐️
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dest = audioCtx.createMediaStreamDestination();
            source = audioCtx.createMediaElementSource(v);
            source.connect(dest); 
            source.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        chunks = []; 
        v.currentTime = 0; 
        await v.play();
        
        const stream = canvas.captureStream(30);
        const combined = new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
        
        recorder = new MediaRecorder(combined, { mimeType: 'video/webm', videoBitsPerSecond: 2500000 });
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            downloadBtn.href = URL.createObjectURL(blob);
            downloadBtn.download = "LIC_Video.webm";
            // రికార్డింగ్ పూర్తయ్యాక మాత్రమే డౌన్‌లోడ్ బటన్ కనబడుతుంది
            downloadBtn.style.display = "inline-block";
        };
        recorder.start();
    };
    
    stopBtn.onclick = () => { v.pause(); if(recorder && recorder.state !== "inactive") recorder.stop(); startBtn.disabled = false; stopBtn.disabled = true; };
    document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrolling Banner Video Editor</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 20px; background-color: #f4f4f9;}
        canvas { border: 2px solid #333; border-radius: 8px; margin-top: 15px; background-color: #000; max-width: 100%; max-height: 60vh; object-fit: contain;}
        button { padding: 10px 15px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px;}
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h2>వెబ్ వీడియో ఎడిటర్ - స్క్రోలింగ్ బ్యానర్</h2>
    
    <label><b>మీ బ్యానర్ ఇమేజ్ అప్లోడ్ చేయండి: </b></label>
    <input type="file" id="imageUpload" accept="image/*" /><br>

    <canvas id="canvas"></canvas><br>

    <button id="startBtn">▶ ప్లే & రికార్డింగ్</button>
    <button id="stopBtn" disabled>⏹ డౌన్‌లోడ్</button>

    <!-- ఇక్కడ మీ వీడియో పేరు 'video.mp4' అని ఉండాలి -->
    <video id="video" src="video.mp4" style="display: none;" crossorigin="anonymous"></video>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        let watermarkImage = new Image();
        let mediaRecorder;
        let recordedChunks = [];
        
        // స్క్రోలింగ్ కోసం వాడే వేరియబుల్
        let watermarkScrollY = null; 

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => watermarkImage.src = event.target.result;
                reader.readAsDataURL(file);
            }
        });

        video.addEventListener('loadedmetadata', function() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        });

        function draw() {
            if (video.paused || video.ended) return;
            
            // 1. ఒరిజినల్ వీడియోను డ్రా చేయడం
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 2. స్క్రోలింగ్ వాటర్ మార్క్ ను డ్రా చేయడం
            if (watermarkImage.src && watermarkScrollY !== null) {
                
                // ఇమేజ్ ఒరిజినల్ క్వాలిటీ పాడవకుండా వీడియో సైజుకి తగ్గట్టు మార్చడం
                let bannerWidth = canvas.width * 0.9; // వీడియో వెడల్పులో 90% ఆక్రమిస్తుంది
                let bannerHeight = (watermarkImage.height / watermarkImage.width) * bannerWidth;
                let xPosition = (canvas.width - bannerWidth) / 2; // కరెక్ట్ గా మధ్యలో (Center) వచ్చేలా

                ctx.globalAlpha = 0.85; // 85% ట్రాన్స్పరెన్సీ (వెనుక వీడియో కొంచెం కనిపిస్తుంది)
                
                // ఇమేజ్ ని కాన్వాస్ పై గీయడం
                ctx.drawImage(watermarkImage, xPosition, watermarkScrollY, bannerWidth, bannerHeight); 
                
                ctx.globalAlpha = 1.0; // తిరిగి నార్మల్ చేయడం

                // 3. స్క్రోలింగ్ యానిమేషన్ లాజిక్ (పైకి కదలడం)
                watermarkScrollY -= 2; // స్పీడ్. ఇక్కడ 2 బదులు 3 పెడితే ఇంకా ఫాస్ట్ గా వెళ్తుంది, 1 పెడితే స్లో గా వెళ్తుంది.

                // ఇమేజ్ పూర్తిగా పైకి వెళ్ళిపోయిన తర్వాత, మళ్ళీ కింద నుండి స్టార్ట్ అవ్వడానికి
                if (watermarkScrollY + bannerHeight < 0) {
                    watermarkScrollY = canvas.height;
                }
            }
            
            requestAnimationFrame(draw);
        }

        startBtn.addEventListener('click', () => {
            video.play();
            
            // రికార్డింగ్ స్టార్ట్ అవ్వగానే ఇమేజ్ వీడియో కింద భాగం నుండి స్టార్ట్ అవ్వాలి
            watermarkScrollY = canvas.height; 
            
            draw(); 
            
            const canvasStream = canvas.captureStream(30); 
            let videoStream;
            if (video.captureStream) videoStream = video.captureStream();
            else if (video.mozCaptureStream) videoStream = video.mozCaptureStream();

            if (videoStream && videoStream.getAudioTracks().length > 0) {
                canvasStream.addTrack(videoStream.getAudioTracks()[0]);
            }

            mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
            recordedChunks = [];
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.start();
            
            startBtn.disabled = true; stopBtn.disabled = false;
        });

        stopBtn.addEventListener('click', () => {
            video.pause(); mediaRecorder.stop();
            startBtn.disabled = false; stopBtn.disabled = true;

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'scrolling-banner-video.webm'; a.click();
            };
        });

        video.addEventListener('ended', () => { if(!stopBtn.disabled) stopBtn.click(); });
    </script>
</body>
</html>

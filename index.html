<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Video Editor - Main + Outro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f0f2f5;}
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        canvas { border: 3px solid #004aad; border-radius: 10px; background-color: #000; max-width: 100%; height: auto; margin-top: 15px; }
        .status-box { padding: 10px; margin: 10px 0; font-weight: bold; border-radius: 5px; }
        .loading { background: #fff3cd; color: #856404; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .controls { margin-top: 20px; }
        button { padding: 12px 25px; margin: 10px 5px; cursor: pointer; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; transition: 0.3s; }
        #startBtn { background: #004aad; color: white; }
        #stopBtn { background: #dc3545; color: white; }
        #downloadBtn { background: #28a745; color: white; display: none; }
        button:disabled { background: #ccc !important; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>LIC వీడియో ఎడిటర్ - ఆటో ఏజెంట్ అడ్వర్టైజ్మెంట్</h2>
    <div id="status" class="status-box loading">గూగుల్ షీట్ నుండి డేటా లోడ్ అవుతోంది...</div>

    <canvas id="canvas"></canvas>

    <div class="controls">
        <button id="startBtn" disabled>▶ రికార్డింగ్ ప్రారంభించండి</button>
        <button id="stopBtn" disabled>⏹ ఆపు</button>
        <button id="downloadBtn">📥 ఫైనల్ వీడియో డౌన్‌లోడ్ చేయండి</button>
    </div>
</div>

<!-- వీడియో ఎలిమెంట్స్ -->
<video id="video" src="video.mp4" style="display: none;" crossorigin="anonymous"></video>
<video id="outroVideo" style="display: none;" crossorigin="anonymous"></video>

<script>
    const video = document.getElementById('video');
    const outroVideo = document.getElementById('outroVideo');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusDiv = document.getElementById('status');

    let watermarkImage = new Image();
    let mediaRecorder;
    let recordedChunks = [];
    let watermarkScrollY = 0;
    let isScrolling = false;
    let finalVideoUrl = null;
    let currentVideo = video;

    // మీ గూగుల్ షీట్ లింక్
    const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReHcj4b9ZAKFQxhMyXFZ_sQQsQHYlyhuPpxr1FmwGXsGRuFhcyUTcP3SeIsmLL04fXfS56feC3Hsoq/pub?gid=0&single=true&output=csv";
    
    // ఏజెంట్ మొబైల్ నంబర్ (ఇది మీరు పంపిన షీట్ లో ఉంది)
    const loginMobile = "8341306663"; 

    async function loadData() {
        try {
            const response = await fetch(sheetCSVUrl);
            const csvData = await response.text();
            const rows = csvData.split("\n");
            
            let imageUrl = "";
            let clipUrl = "";

            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(",");
                if (cols[0] && cols[0].trim() === loginMobile) {
                    imageUrl = cols[1] ? cols[1].trim() : "";
                    clipUrl = cols[2] ? cols[2].trim() : ""; // Column C
                    break;
                }
            }

            if (imageUrl && clipUrl) {
                // ఇమేజ్ లోడ్ చేయడం
                watermarkImage.crossOrigin = "anonymous";
                watermarkImage.src = imageUrl;

                // 8సె క్లిప్ లోడ్ చేయడం
                outroVideo.src = clipUrl;
                outroVideo.load();

                watermarkImage.onload = () => {
                    statusDiv.className = "status-box success";
                    statusDiv.innerText = "ఏజెంట్ వివరాలు లోడ్ అయ్యాయి! రికార్డింగ్ ప్రారంభించవచ్చు.";
                    startBtn.disabled = false;
                    watermarkScrollY = canvas.height;
                };
            } else {
                statusDiv.className = "status-box error";
                statusDiv.innerText = "షీట్‌లో ఈ నంబర్ వివరాలు (Image లేదా Clip) లేవు!";
            }
        } catch (e) {
            statusDiv.className = "status-box error";
            statusDiv.innerText = "డేటా లోడింగ్ ఫెయిల్ అయింది!";
        }
    }

    loadData();

    // కాన్వాస్ సైజు సెట్ చేయడం
    video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        watermarkScrollY = canvas.height;
    };

    function draw() {
        if (currentVideo.paused || currentVideo.ended) return;
        
        ctx.drawImage(currentVideo, 0, 0, canvas.width, canvas.height);

        // బ్యానర్ కేవలం మెయిన్ వీడియో పైన మాత్రమే రావాలి
        if (currentVideo === video && watermarkImage.src) {
            let wWidth = canvas.width * 0.98;
            let wHeight = (watermarkImage.height / watermarkImage.width) * wWidth;
            let xPos = (canvas.width - wWidth) / 2;
            
            ctx.drawImage(watermarkImage, xPos, watermarkScrollY, wWidth, wHeight);
            
            if (isScrolling) {
                watermarkScrollY -= 2.2;
                if (watermarkScrollY + wHeight < 0) watermarkScrollY = canvas.height;
            }
        }
        requestAnimationFrame(draw);
    }

    startBtn.onclick = () => {
        recordedChunks = [];
        if (finalVideoUrl) URL.revokeObjectURL(finalVideoUrl);
        downloadBtn.style.display = "none";
        
        isScrolling = true;
        currentVideo = video;
        video.play();
        draw();

        const stream = canvas.captureStream(30);
        
        // ఆడియో ట్రాక్ యాడ్ చేయడం
        const vStream = video.captureStream ? video.captureStream() : video.mozCaptureStream();
        if (vStream.getAudioTracks().length > 0) stream.addTrack(vStream.getAudioTracks()[0]);

        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 6000000 });
        mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
        
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            finalVideoUrl = URL.createObjectURL(blob);
            downloadBtn.style.display = "inline-block";
        };

        mediaRecorder.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
    };

    // మెయిన్ వీడియో అయిపోగానే 8సె క్లిప్ ప్లే చేయడం
    video.onended = () => {
        isScrolling = false; // అవుట్రో క్లిప్ మీద బ్యానర్ వద్దు
        currentVideo = outroVideo;
        
        // అవుట్రో ఆడియో కోసం స్ట్రీమ్ కి ట్రాక్ మార్చడం అవసరం లేదు, కాన్వాస్ రికార్డింగ్ లో ఆడియో మిక్స్ అవుతుంది
        outroVideo.play();
        draw();
    };

    // అవుట్రో కూడా అయిపోగానే రికార్డింగ్ ఆపేయాలి
    outroVideo.onended = () => {
        if(!stopBtn.disabled) stopBtn.onclick();
    };

    stopBtn.onclick = () => {
        video.pause(); 
        outroVideo.pause();
        mediaRecorder.stop();
        startBtn.disabled = false;
        stopBtn.disabled = true;
    };

    downloadBtn.onclick = () => {
        if (finalVideoUrl) {
            const a = document.createElement('a');
            a.href = finalVideoUrl;
            a.download = 'LIC_Agent_Final_Video.webm';
            a.click();
        }
    };
</script>

</body>
</html>

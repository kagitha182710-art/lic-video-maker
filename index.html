<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Video Final Solution</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 10px; }
        .container { max-width: 450px; margin: auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        canvas { border: 4px solid #004aad; border-radius: 10px; background: #000; width: 100%; height: auto; }
        .status-box { padding: 10px; margin-bottom: 10px; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .info { background: #e7f3ff; color: #004aad; }
        .error { background: #ffebeb; color: #d93025; }
        .success { background: #e6ffed; color: #1e8e3e; }
        .btns { margin-top: 15px; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px; }
        #startBtn { background: #004aad; color: #fff; }
        #stopBtn { background: #d93025; color: #fff; }
        #downloadBtn { background: #1e8e3e; color: #fff; display: none; text-decoration: none; padding: 12px 24px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h3>LIC వీడియో ఎడిటర్</h3>
    <div id="status" class="status-box info">డేటా కోసం వెతుకుతున్నాము...</div>
    <canvas id="canvas"></canvas>
    <div class="btns">
        <button id="startBtn" disabled>▶ రికార్డింగ్ ప్రారంభించండి</button>
        <button id="stopBtn" disabled>⏹ ఆపు</button>
        <a id="downloadBtn" href="#">📥 వీడియో డౌన్‌లోడ్</a>
    </div>
</div>

<video id="vPlayer" style="display:none;" crossorigin="anonymous" playsinline muted></video>

<script>
    const v = document.getElementById('vPlayer');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let watermark = new Image();
    let recorder;
    let chunks = [];
    let isScrolling = false;
    let yPos = 0;
    let mainSrc = "video.mp4";
    let outroSrc = "";
    let isOutro = false;

    // మీ గూగుల్ షీట్ మరియు మొబైల్ నంబర్
    const sheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReHcj4b9ZAKFQxhMyXFZ_sQQsQHYlyhuPpxr1FmwGXsGRuFhcyUTcP3SeIsmLL04fXfS56feC3Hsoq/pub?gid=0&single=true&output=csv";
    const agentMobile = "9959041086";

    async function startApp() {
        try {
            const r = await fetch(sheet + "&cb=" + Date.now());
            const text = await r.text();
            const rows = text.split("\n");
            
            let img = "", clip = "";
            for (let i = 1; i < rows.length; i++) {
                let cols = rows[i].split(",");
                if (cols[0] && cols[0].replace(/\D/g,'') === agentMobile) {
                    img = cols[1]?.trim();
                    clip = cols[2]?.trim();
                    break;
                }
            }

            if (img && clip) {
                outroSrc = clip;
                watermark.crossOrigin = "anonymous";
                watermark.src = img;
                watermark.onload = () => {
                    status.className = "status-box success";
                    status.innerText = "ఏజెంట్ వివరాలు లోడ్ అయ్యాయి! రికార్డ్ చేయండి.";
                    startBtn.disabled = false;
                    v.src = mainSrc;
                    v.load();
                };
            } else {
                status.className = "status-box error";
                status.innerText = "షీట్‌లో డేటా దొరకలేదు!";
            }
        } catch (e) {
            status.className = "status-box error";
            status.innerText = "కనెక్షన్ సమస్య!";
        }
    }

    startApp();

    v.onloadedmetadata = () => {
        canvas.width = v.videoWidth;
        canvas.height = v.videoHeight;
        yPos = canvas.height;
    };

    function loop() {
        if (v.paused || v.ended) return;
        ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

        if (!isOutro && watermark.complete) {
            let w = canvas.width * 0.98;
            let h = (watermark.height / watermark.width) * w;
            ctx.drawImage(watermark, (canvas.width - w) / 2, yPos, w, h);
            if (isScrolling) {
                yPos -= 2.5; // స్క్రోలింగ్ స్పీడ్
                if (yPos + h < 0) yPos = canvas.height;
            }
        }
        requestAnimationFrame(loop);
    }

    startBtn.onclick = () => {
        isOutro = false;
        yPos = canvas.height;
        isScrolling = true;
        chunks = [];
        v.src = mainSrc;
        v.muted = false;
        v.play();
        loop();

        const stream = canvas.captureStream(30);
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 6000000 });
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            downloadBtn.href = URL.createObjectURL(blob);
            downloadBtn.download = "LIC_Agent_Video.webm";
            downloadBtn.style.display = "inline-block";
        };
        recorder.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
    };

    v.onended = () => {
        if (!isOutro) {
            isOutro = true;
            isScrolling = false;
            v.src = outroSrc;
            v.play().catch(() => stopBtn.click());
        } else {
            stopBtn.click();
        }
    };

    stopBtn.onclick = () => {
        v.pause();
        if (recorder.state !== "inactive") recorder.stop();
        startBtn.disabled = false;
        stopBtn.disabled = true;
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Video Editor - Final Version</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 20px; background-color: #f4f4f9;}
        canvas { border: 2px solid #333; border-radius: 8px; margin-top: 15px; background-color: #000; max-width: 100%; max-height: 60vh; object-fit: contain;}
        .controls { margin-top: 20px; }
        button { padding: 12px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold;}
        button:disabled { background: #ccc; cursor: not-allowed; }
        #downloadBtn { background: #28a745; display: none; } /* డౌన్‌లోడ్ బటన్ మొదట కనిపించదు */
    </style>
</head>
<body>

    <h2>LIC వీడియో ఎడిటర్</h2>
    
    <div style="margin-bottom: 15px;">
        <label><b>మీ బ్యానర్/విజిటింగ్ కార్డ్ అప్లోడ్ చేయండి: </b></label>
        <input type="file" id="imageUpload" accept="image/*" />
    </div>

    <canvas id="canvas"></canvas><br>

    <div class="controls">
        <button id="startBtn">▶ ప్లే & రికార్డింగ్ స్టార్ట్</button>
        <button id="stopBtn" disabled>⏹ రికార్డింగ్ స్టాప్</button>
        <button id="downloadBtn">📥 వీడియో డౌన్‌లోడ్ చేయండి</button>
    </div>

    <!-- వీడియో ఫైల్ పేరు కచ్చితంగా video.mp4 అని ఉండాలి -->
    <video id="video" src="video.mp4" style="display: none;" crossorigin="anonymous"></video>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let watermarkImage = new Image();
        let mediaRecorder;
        let recordedChunks = [];
        let watermarkScrollY = 0;
        let isScrolling = false;
        let finalVideoUrl = null;

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    watermarkImage.src = event.target.result;
                    watermarkImage.onload = () => {
                        watermarkScrollY = canvas.height;
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        video.addEventListener('loadedmetadata', function() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            watermarkScrollY = canvas.height;
        });

        function drawWatermark() {
            if (watermarkImage.src) {
                // ఇమేజ్ రేషియో పాడవకుండా వీడియో వెడల్పులో 95% ఉండేలా సెట్ చేయడం
                let wWidth = canvas.width * 0.95; 
                let wHeight = (watermarkImage.height / watermarkImage.width) * wWidth;
                let xPos = (canvas.width - wWidth) / 2; // సెంటర్ లో ఉండటానికి

                ctx.drawImage(watermarkImage, xPos, watermarkScrollY, wWidth, wHeight);
                
                if (isScrolling) {
                    watermarkScrollY -= 1.8; // స్క్రోలింగ్ స్పీడ్
                    if (watermarkScrollY + wHeight < 0) {
                        watermarkScrollY = canvas.height;
                    }
                }
            }
        }

        function draw() {
            if (video.paused || video.ended) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            drawWatermark();
            requestAnimationFrame(draw);
        }

        startBtn.addEventListener('click', () => {
            if (!watermarkImage.src) {
                alert("ముందుగా ఇమేజ్ సెలెక్ట్ చేయండి!");
                return;
            }
            recordedChunks = [];
            if (finalVideoUrl) URL.revokeObjectURL(finalVideoUrl);
            finalVideoUrl = null;
            downloadBtn.style.display = "none";
            
            isScrolling = true;
            video.play();
            draw();

            const canvasStream = canvas.captureStream(30);
            let videoStream = video.captureStream ? video.captureStream() : video.mozCaptureStream();

            if (videoStream && videoStream.getAudioTracks().length > 0) {
                canvasStream.addTrack(videoStream.getAudioTracks()[0]);
            }

            mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                finalVideoUrl = URL.createObjectURL(blob);
                downloadBtn.style.display = "inline-block"; // రికార్డింగ్ ఆగాక బటన్ వస్తుంది కానీ ఆటోమేటిక్ డౌన్‌లోడ్ అవ్వదు
            };

            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
        });

        stopBtn.addEventListener('click', () => {
            video.pause();
            isScrolling = false;
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });

        // కేవలం యూజర్ బటన్ నొక్కితేనే డౌన్‌లోడ్ అవుతుంది
        downloadBtn.addEventListener('click', () => {
            if (finalVideoUrl) {
                const a = document.createElement('a');
                a.href = finalVideoUrl;
                a.download = 'lic-video.webm';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        });

        video.addEventListener('ended', () => { if(!stopBtn.disabled) stopBtn.click(); });
    </script>
</body>
</html>

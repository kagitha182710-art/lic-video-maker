<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Video Maker - Premium Version</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f5; padding: 10px; -webkit-user-select: none; user-select: none; }
        .container { max-width: 450px; margin: auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        canvas { border: 2px solid #ccc; border-radius: 10px; background: #fff; width: 100%; height: auto; display: block; margin: auto; }
        .status-box { padding: 10px; margin-bottom: 10px; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .success { background: #d4edda; color: #155724; }
        .loading { background: #fff3cd; color: #856404; }
        .recording { background: #ffeeba; color: #d39e00; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px; }
        #startBtn { background: #004aad; color: #fff; }
        #stopBtn { background: #d93025; color: #fff; }
        #downloadBtn { background: #1e8e3e; color: #fff; display: none; text-decoration: none; padding: 12px 24px; border-radius: 8px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div id="status" class="status-box loading">ప్రీమియం ఫీచర్స్ లోడ్ అవుతున్నాయి...</div>
    <canvas id="canvas"></canvas>
    <div style="margin-top:15px;">
        <button id="startBtn" disabled>▶ రికార్డింగ్ ప్రారంభించండి</button>
        <button id="stopBtn" disabled>⏹ ఆపు</button>
        <br><br>
        <a id="downloadBtn" href="#">📥 ఫైనల్ వీడియో డౌన్‌లోడ్</a>
    </div>
</div>

<video id="vPlayer" style="display:none;" playsinline crossorigin="anonymous"></video>

<script>
    const v = document.getElementById('vPlayer');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let fixedImg = new Image();
    let borderImg = new Image();
    let recorder, chunks = [];
    
    let waterName = "";
    let agentMob = "";
    let nameX = 50, nameY = 80, mobX = 100, mobY = 200;
    let lastUpdate = 0;

    let mainSrc = "https://kagitha182710-art.github.io/lic-video-maker/today.mp4?v=" + Date.now();
    let borderSrc = "TRASPARENT BACKROUND.png"; 
    let outroSrc = "";
    
    let isOutro = false, audioCtx, dest, source;

    const sheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReHcj4b9ZAKFQxhMyXFZ_sQQsQHYlyhuPpxr1FmwGXsGRuFhcyUTcP3SeIsmLL04fXfS56feC3Hsoq/pub?gid=0&single=true&output=csv";
    const agentMobile = "9959041086";

    async function loadData() {
        try {
            const r = await fetch(sheet + "&cb=" + Date.now());
            const text = await r.text();
            const rows = text.split("\n");
            let fSrc = "";
            
            for (let i = 0; i < rows.length; i++) {
                let cols = rows[i].split(",");
                if (cols[0] && cols[0].trim().includes(agentMobile)) {
                    agentMob = cols[0]?.trim(); 
                    waterName = cols[4]?.trim() || ""; 
                    fSrc = cols[1]?.trim(); 
                    outroSrc = cols[2]?.trim(); 
                    break;
                }
            }

            let loadPromises = [];
            loadPromises.push(new Promise(res => { borderImg.onload = res; borderImg.src = borderSrc; }));
            if (fSrc) {
                fixedImg.crossOrigin = "anonymous";
                loadPromises.push(new Promise(res => { fixedImg.onload = res; fixedImg.src = fSrc; }));
            }

            await Promise.all(loadPromises);
            v.src = mainSrc;
            v.load(); 
        } catch (e) { status.innerText = "డేటా ఎర్రర్!"; }
    }

    loadData();

    v.onloadedmetadata = () => {
        canvas.width = v.videoWidth;
        canvas.height = v.videoHeight;
    };

    v.onloadeddata = () => {
        render(); // వీడియో లోడ్ అవ్వగానే మొదటి ఫ్రేమ్ గీస్తుంది
        status.className = "status-box success";
        status.innerText = "ప్రీమియం వాటర్ మార్క్స్ రెడీ!";
        startBtn.disabled = false;
    };

    function render() {
        let w = canvas.width;
        let h = canvas.height;

        // 1. మెయిన్ వీడియో లేదా వైట్ బ్యాగ్రౌండ్ (లోడ్ అయ్యే వరకు)
        if (v.readyState >= 2) {
            ctx.drawImage(v, 0, 0, w, h);
        } else {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);
        }

        // --- ఐకాన్స్‌తో కూడిన రాండమ్ వాటర్ మార్క్స్ ---
        if (!v.paused && !v.ended) {
            let now = Date.now();
            if (now - lastUpdate > 4000) { 
                nameX = Math.random() * (w - 200) + 30;
                nameY = Math.random() * (h/2 - 100) + 100;
                mobX = Math.random() * (w - 200) + 30;
                mobY = Math.random() * (h/2 - 100) + (h/2);
                lastUpdate = now;
            }
            
            ctx.save();
            ctx.globalAlpha = 0.5; // థిక్ గా కనిపించడానికి పెంచాను
            ctx.shadowBlur = 4;
            ctx.shadowColor = "black";
            
            // యూజర్ ఐకాన్ + పేరు (Bold)
            ctx.font = "bold 24px Segoe UI";
            ctx.fillStyle = "#FFD700"; // గోల్డ్ కలర్ ఐకాన్ కోసం
            if(waterName) {
                ctx.fillText("👤", nameX - 30, nameY); // ఐకాన్
                ctx.fillStyle = "white";
                ctx.fillText(waterName, nameX, nameY); 
            }
            
            // మొబైల్ ఐకాన్ + నంబర్ (Bold)
            ctx.font = "bold 22px Segoe UI";
            ctx.fillStyle = "#25D366"; // వాట్సాప్ గ్రీన్ కలర్ ఐకాన్ కోసం
            ctx.fillText("📞", mobX - 30, mobY); // ఐకాన్
            ctx.fillStyle = "white";
            ctx.fillText(agentMob, mobX, mobY);
            
            ctx.restore();
        }

        // 3. కింద ఫిక్స్‌డ్ బ్యానర్ (ముందే కనిపిస్తుంది)
        if (fixedImg.complete) {
            let targetWidth = w * 0.95; 
            let fH = ((fixedImg.height / fixedImg.width) * targetWidth) * 0.85; 
            let xOffset = (w - targetWidth) / 2; 
            let yOffset = 20; 
            ctx.drawImage(fixedImg, xOffset, h - fH - yOffset, targetWidth, fH);
        }

        // 4. బోర్డర్
        if (borderImg.complete) {
            ctx.drawImage(borderImg, 0, 0, w, h);
        }
    }

    function loop() {
        if (!v.paused && !v.ended) {
            render();
            requestAnimationFrame(loop);
        }
    }
    v.addEventListener('play', loop);

    startBtn.onclick = async () => {
        try {
            startBtn.disabled = true;
            status.className = "status-box recording";
            status.innerText = "వీడియో తయారవుతోంది...";

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                dest = audioCtx.createMediaStreamDestination();
                source = audioCtx.createMediaElementSource(v);
                source.connect(dest);
                source.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            chunks = []; 
            isOutro = false;
            v.currentTime = 0; 
            await v.play(); 

            const stream = canvas.captureStream(30);
            const combined = new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]);

            recorder = new MediaRecorder(combined, { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 2500000 });
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                downloadBtn.href = URL.createObjectURL(blob);
                downloadBtn.download = "LIC_Premium_Video.webm";
                downloadBtn.style.display = "inline-block";
                status.innerText = "డౌన్‌లోడ్ చేసుకోండి!";
            };
            recorder.start();
            stopBtn.disabled = false;
        } catch (e) { alert(e.message); }
    };

    v.onended = () => {
        if (!isOutro && outroSrc) {
            isOutro = true;
            v.src = outroSrc;
            v.play();
        } else { stopBtn.click(); }
    };

    stopBtn.onclick = () => {
        v.pause();
        if (recorder && recorder.state !== "inactive") recorder.stop();
        startBtn.disabled = false; stopBtn.disabled = true;
    };

    // సెక్యూరిటీ
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = e => {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) return false;
    };
</script>
</body>
</html>

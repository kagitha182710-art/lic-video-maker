<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Pro Editor - Single Slow Scroll</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f5; padding: 10px; }
        .container { max-width: 450px; margin: auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        canvas { border: 4px solid #004aad; border-radius: 10px; background: #000; width: 100%; height: auto; }
        .status-box { padding: 10px; margin-bottom: 10px; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .success { background: #d4edda; color: #155724; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px; }
        #startBtn { background: #004aad; color: #fff; }
        #stopBtn { background: #d93025; color: #fff; }
        #downloadBtn { background: #1e8e3e; color: #fff; display: none; text-decoration: none; padding: 12px 24px; border-radius: 8px; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="container">
    <div id="status" class="status-box">సింగిల్ స్లో స్క్రోల్ సెట్ చేస్తున్నాము...</div>
    <canvas id="canvas"></canvas>
    <div style="margin-top:15px;">
        <button id="startBtn" disabled>▶ రికార్డింగ్ ప్రారంభించండి</button>
        <button id="stopBtn" disabled>⏹ ఆపు</button>
        <br><br>
        <a id="downloadBtn" href="#">📥 ఫైనల్ వీడియో డౌన్‌లోడ్</a>
    </div>
</div>

<video id="mainVideo" src="video.mp4" style="display:none;" crossorigin="anonymous" playsinline muted></video>
<video id="outroVideo" style="display:none;" crossorigin="anonymous" playsinline muted></video>

<script>
    const mainVideo = document.getElementById('mainVideo');
    const outroVideo = document.getElementById('outroVideo');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let fixedImg = new Image();
    let scrollImg = new Image();
    let recorder, chunks = [], scrollY = 0;
    let currentVideo = mainVideo;
    let audioCtx, dest, sourceMain, sourceOutro;
    let isScrolling = false;

    const sheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReHcj4b9ZAKFQxhMyXFZ_sQQsQHYlyhuPpxr1FmwGXsGRuFhcyUTcP3SeIsmLL04fXfS56feC3Hsoq/pub?gid=0&single=true&output=csv";
    const agentMobile = "9959041086";

    async function loadData() {
        try {
            const r = await fetch(sheet + "&cb=" + Date.now());
            const text = await r.text();
            const rows = text.split("\n");
            for (let i = 0; i < rows.length; i++) {
                let cols = rows[i].split(",");
                if (cols[0] && cols[0].trim().includes(agentMobile)) {
                    fixedImg.crossOrigin = "anonymous";
                    fixedImg.src = cols[1]?.trim(); 
                    scrollImg.crossOrigin = "anonymous";
                    scrollImg.src = cols[3]?.trim(); 
                    outroVideo.src = cols[2]?.trim(); 
                    break;
                }
            }
            fixedImg.onload = () => {
                status.className = "status-box success";
                status.innerText = "సింగిల్ స్లో స్క్రోల్ సిద్ధం!";
                startBtn.disabled = false;
            };
        } catch (e) { status.innerText = "డేటా ఎర్రర్!"; }
    }

    loadData();

    mainVideo.onloadedmetadata = () => {
        canvas.width = mainVideo.videoWidth;
        canvas.height = mainVideo.videoHeight;
        scrollY = canvas.height;
    };

    function draw() {
        ctx.drawImage(currentVideo, 0, 0, canvas.width, canvas.height);

        let w = canvas.width;
        if (scrollImg.complete && scrollImg.src !== "" && isScrolling) {
            ctx.save();
            ctx.globalAlpha = 0.15;
            let sH = (scrollImg.height / scrollImg.width) * w;
            ctx.drawImage(scrollImg, 0, scrollY, w, sH);
            
            // నెమ్మదిగా ఒకే ఒక్కసారి స్క్రోల్ అవ్వడానికి
            if (scrollY + sH > -100) { 
                scrollY -= 0.40; 
            }
            ctx.restore();
        }

        if (fixedImg.complete && fixedImg.src !== "") {
            let fH = (fixedImg.height / fixedImg.width) * w;
            ctx.drawImage(fixedImg, 0, canvas.height - fH, w, fH);
        }

        if (!currentVideo.paused && !currentVideo.ended) {
            requestAnimationFrame(draw);
        }
    }

    startBtn.onclick = () => {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dest = audioCtx.createMediaStreamDestination();
            sourceMain = audioCtx.createMediaElementSource(mainVideo);
            sourceOutro = audioCtx.createMediaElementSource(outroVideo);
            sourceMain.connect(dest);
            sourceOutro.connect(dest);
            sourceMain.connect(audioCtx.destination);
            sourceOutro.connect(audioCtx.destination);
        }

        chunks = []; 
        scrollY = canvas.height; // మళ్ళీ మొదటి నుండి మొదలు
        isScrolling = true;
        currentVideo = mainVideo;
        mainVideo.play();
        draw();

        const canvasStream = canvas.captureStream(30);
        const finalStream = new MediaStream([...canvasStream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
        
        recorder = new MediaRecorder(finalStream, { 
            mimeType: 'video/webm;codecs=vp8,opus', 
            videoBitsPerSecond: 1500000 
        });

        recorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            downloadBtn.href = URL.createObjectURL(blob);
            downloadBtn.download = "LIC_Single_Scroll.webm";
            downloadBtn.style.display = "inline-block";
        };

        recorder.start();
        startBtn.disabled = true; stopBtn.disabled = false;
    };

    mainVideo.onended = () => {
        currentVideo = outroVideo;
        outroVideo.play();
        draw();
    };

    outroVideo.onended = () => {
        if(!stopBtn.disabled) stopBtn.onclick();
    };

    stopBtn.onclick = () => {
        mainVideo.pause(); outroVideo.pause();
        isScrolling = false;
        if (recorder && recorder.state !== "inactive") recorder.stop();
        startBtn.disabled = false; stopBtn.disabled = true;
    };
</script>
</body>
</html>

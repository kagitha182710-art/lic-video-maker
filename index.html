<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Pro Editor - News Video Fixed</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f5; padding: 10px; }
        .container { max-width: 450px; margin: auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        canvas { border: 4px solid #004aad; border-radius: 10px; background: #000; width: 100%; height: auto; }
        .status-box { padding: 10px; margin-bottom: 10px; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .success { background: #d4edda; color: #155724; }
        .loading { background: #fff3cd; color: #856404; }
        .recording { background: #ffeeba; color: #d39e00; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px; }
        #startBtn { background: #004aad; color: #fff; }
        #stopBtn { background: #d93025; color: #fff; }
        #downloadBtn { background: #1e8e3e; color: #fff; display: none; text-decoration: none; padding: 12px 24px; border-radius: 8px; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="container">
    <div id="status" class="status-box loading">డేటా లోడ్ అవుతోంది...</div>
    <canvas id="canvas"></canvas>
    <div style="margin-top:15px;">
        <button id="startBtn" disabled>▶ రికార్డింగ్ ప్రారంభించండి</button>
        <button id="stopBtn" disabled>⏹ ఆపు</button>
        <br><br>
        <a id="downloadBtn" href="#">📥 ఫైనల్ వీడియో డౌన్‌లోడ్</a>
    </div>
</div>

<video id="vPlayer" style="display:none;" crossorigin="anonymous" playsinline></video>

<script>
    const v = document.getElementById('vPlayer');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let fixedImg = new Image();
    let scrollImg = new Image();
    let recorder, chunks = [], scrollY = 0;
    
    // ఇక్కడ మీరు అడిగినట్లుగా news.mp4 అని మార్చాను
    let mainSrc = "news.mp4", outroSrc = "";
    
    let isOutro = false, audioCtx, dest, source;
    let isScrolling = false;

    const sheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReHcj4b9ZAKFQxhMyXFZ_sQQsQHYlyhuPpxr1FmwGXsGRuFhcyUTcP3SeIsmLL04fXfS56feC3Hsoq/pub?gid=0&single=true&output=csv";
    const agentMobile = "9959041086";

    async function loadData() {
        try {
            const r = await fetch(sheet + "&cb=" + Date.now());
            const text = await r.text();
            const rows = text.split("\n");
            
            let fSrc = "", sSrc = "";
            for (let i = 0; i < rows.length; i++) {
                let cols = rows[i].split(",");
                if (cols[0] && cols[0].trim().includes(agentMobile)) {
                    fSrc = cols[1]?.trim(); 
                    outroSrc = cols[2]?.trim(); 
                    sSrc = cols[3]?.trim(); 
                    break;
                }
            }

            let loadPromises = [];
            if (fSrc) {
                loadPromises.push(new Promise(res => {
                    fixedImg.crossOrigin = "anonymous";
                    fixedImg.onload = res;
                    fixedImg.src = fSrc;
                }));
            }
            if (sSrc) {
                loadPromises.push(new Promise(res => {
                    scrollImg.crossOrigin = "anonymous";
                    scrollImg.onload = res;
                    scrollImg.src = sSrc;
                }));
            }

            await Promise.all(loadPromises);

            status.className = "status-box success";
            status.innerText = "రెడీ! రికార్డింగ్ ప్రారంభించండి.";
            startBtn.disabled = false;
            
            // వీడియో ముందే లోడ్ చేసి పెట్టుకుంటున్నాం
            v.src = mainSrc;
            v.load(); 
            
        } catch (e) { 
            status.className = "status-box error";
            status.innerText = "డేటా లోడ్ ఎర్రర్!"; 
            console.error(e);
        }
    }

    loadData();

    // మొదటి ఫ్రేమ్ డ్రా చేయడం
    v.onloadeddata = () => {
        canvas.width = v.videoWidth;
        canvas.height = v.videoHeight;
        ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
        let w = canvas.width;
        if (fixedImg.src) {
            let fH = (fixedImg.height / fixedImg.width) * w;
            ctx.drawImage(fixedImg, 0, canvas.height - fH, w, fH);
        }
    };

    function draw() {
        if (v.paused || v.ended) return;
        ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
        let w = canvas.width;

        if (scrollImg.src && isScrolling) {
            ctx.save();
            ctx.globalAlpha = 0.15; 
            let sH = (scrollImg.height / scrollImg.width) * w;
            ctx.drawImage(scrollImg, 0, scrollY, w, sH);
            if (scrollY + sH > -50) { scrollY -= 0.8; }
            ctx.restore();
        }

        if (fixedImg.src) {
            let fH = (fixedImg.height / fixedImg.width) * w;
            ctx.drawImage(fixedImg, 0, canvas.height - fH, w, fH);
        }

        requestAnimationFrame(draw);
    }

    v.addEventListener('play', () => {
        requestAnimationFrame(draw);
    });

    startBtn.onclick = async () => {
        try {
            startBtn.disabled = true;
            status.className = "status-box recording";
            status.innerText = "రికార్డింగ్ అవుతోంది... (ఆపకండి)";

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                dest = audioCtx.createMediaStreamDestination();
                source = audioCtx.createMediaElementSource(v);
                source.connect(dest);
                source.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            chunks = []; 
            scrollY = canvas.height - 100; 
            isScrolling = true;
            isOutro = false;
            
            v.currentTime = 0; 
            await v.play(); 

            const canvasStream = canvas.captureStream(30);
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...dest.stream.getAudioTracks()
            ]);

            recorder = new MediaRecorder(combinedStream, { 
                mimeType: 'video/webm;codecs=vp8,opus', 
                videoBitsPerSecond: 1500000 
            });

            recorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                downloadBtn.href = URL.createObjectURL(blob);
                downloadBtn.download = "LIC_Agent_News_Output.webm";
                downloadBtn.style.display = "inline-block";
                status.className = "status-box success";
                status.innerText = "రికార్డింగ్ పూర్తయింది! వీడియో డౌన్‌లోడ్ చేసుకోండి.";
            };

            recorder.start();
            stopBtn.disabled = false;

        } catch (error) {
            alert("రికార్డింగ్ ఫెయిల్ అయింది! కారణం: " + error.message);
            console.error("Error details:", error);
            startBtn.disabled = false;
            status.className = "status-box error";
            status.innerText = "మళ్లీ ప్రయత్నించండి.";
        }
    };

    v.onended = () => {
        if (!isOutro && outroSrc) {
            isOutro = true;
            v.src = outroSrc;
            v.play();
        } else {
            stopBtn.click();
        }
    };

    stopBtn.onclick = () => {
        v.pause();
        isScrolling = false;
        if (recorder && recorder.state !== "inactive") recorder.stop();
        startBtn.disabled = false; stopBtn.disabled = true;
    };
</script>
</body>
</html>

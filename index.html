<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Video Maker - 9959041086 (Final)</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        canvas { border: 4px solid #004aad; border-radius: 12px; background: #000; max-width: 100%; height: auto; }
        .status-box { padding: 15px; margin: 15px 0; font-weight: bold; border-radius: 8px; font-size: 16px; }
        .loading { background: #fff3cd; color: #856404; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 14px 28px; margin: 10px 5px; cursor: pointer; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; }
        #startBtn { background: #004aad; color: white; }
        #stopBtn { background: #dc3545; color: white; }
        #downloadBtn { background: #28a745; color: white; display: none; }
        button:disabled { background: #ccc !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>LIC వీడియో ఎడిటర్ - ఏజెంట్ పోర్టల్</h2>
    <div id="status" class="status-box loading">డేటా లోడ్ అవుతోంది...</div>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <button id="startBtn" disabled>▶ రికార్డింగ్ ప్రారంభించండి</button>
        <button id="stopBtn" disabled>⏹ ఆపు</button>
        <button id="downloadBtn">📥 వీడియో డౌన్‌లోడ్</button>
    </div>
</div>

<!-- ఒకే ఒక వీడియో ఎలిమెంట్ ని వాడుతున్నాం -->
<video id="player" style="display: none;" crossorigin="anonymous" playsinline></video>

<script>
    const player = document.getElementById('player');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusDiv = document.getElementById('status');

    let watermarkImage = new Image();
    let mediaRecorder;
    let recordedChunks = [];
    let watermarkScrollY = 0;
    let isScrolling = false;
    let finalVideoUrl = null;
    
    let mainVideoSrc = "video.mp4";
    let outroVideoSrc = ""; 
    let isOutroPlaying = false;

    const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReHcj4b9ZAKFQxhMyXFZ_sQQsQHYlyhuPpxr1FmwGXsGRuFhcyUTcP3SeIsmLL04fXfS56feC3Hsoq/pub?gid=0&single=true&output=csv";
    const loginMobile = "9959041086"; 

    async function init() {
        try {
            const response = await fetch(sheetCSVUrl + "&t=" + Date.now());
            const data = await response.text();
            const rows = data.split("\n");
            
            let imageUrl = "";
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(",");
                if (cols[0] && cols[0].replace(/\D/g, '') === loginMobile) {
                    imageUrl = cols[1]?.trim();
                    outroVideoSrc = cols[2]?.trim();
                    break;
                }
            }

            if (imageUrl && outroVideoSrc) {
                watermarkImage.crossOrigin = "anonymous";
                watermarkImage.src = imageUrl;
                
                // మొదటి వీడియోను ముందే లోడ్ చేయడం
                player.src = mainVideoSrc;
                player.load();

                watermarkImage.onload = () => {
                    statusDiv.className = "status-box success";
                    statusDiv.innerText = "అన్నీ సిద్ధంగా ఉన్నాయి! 9959041086 ఏజెంట్ కోసం రికార్డ్ చేయవచ్చు.";
                    startBtn.disabled = false;
                };
            } else {
                statusDiv.className = "status-box error";
                statusDiv.innerText = "షీట్‌లో డేటా సరిగ్గా లేదు!";
            }
        } catch (e) {
            statusDiv.className = "status-box error";
            statusDiv.innerText = "లోడింగ్ సమస్య!";
        }
    }

    init();

    player.onloadedmetadata = () => {
        canvas.width = player.videoWidth;
        canvas.height = player.videoHeight;
        watermarkScrollY = canvas.height;
    };

    function render() {
        if (player.paused || player.ended) return;
        ctx.drawImage(player, 0, 0, canvas.width, canvas.height);

        // బ్యానర్ కేవలం మెయిన్ వీడియో మీద మాత్రమే
        if (!isOutroPlaying && watermarkImage.src) {
            let wWidth = canvas.width * 0.98;
            let wHeight = (watermarkImage.height / watermarkImage.width) * wWidth;
            let xPos = (canvas.width - wWidth) / 2;
            ctx.drawImage(watermarkImage, xPos, watermarkScrollY, wWidth, wHeight);
            if (isScrolling) {
                watermarkScrollY -= 2.2;
                if (watermarkScrollY + wHeight < 0) watermarkScrollY = canvas.height;
            }
        }
        requestAnimationFrame(render);
    }

    startBtn.onclick = () => {
        recordedChunks = [];
        isScrolling = true;
        isOutroPlaying = false;
        player.src = mainVideoSrc;
        player.play();
        render();

        const stream = canvas.captureStream(30);
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 6000000 });
        mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            finalVideoUrl = URL.createObjectURL(blob);
            downloadBtn.style.display = "inline-block";
        };

        mediaRecorder.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
    };

    // మెయిన్ వీడియో అయిపోగానే ప్లేయర్ లోపల వీడియో లింక్ మార్చడం
    player.onended = () => {
        if (!isOutroPlaying) {
            isOutroPlaying = true;
            isScrolling = false;
            player.src = outroVideoSrc;
            player.play(); // ఆటోమేటిక్‌గా రెండో క్లిప్ ప్లే అవుతుంది
        } else {
            // రెండో క్లిప్ కూడా అయిపోతే రికార్డింగ్ ఆపేయాలి
            if(!stopBtn.disabled) stopBtn.onclick();
        }
    };

    stopBtn.onclick = () => {
        player.pause();
        if(mediaRecorder) mediaRecorder.stop();
        startBtn.disabled = false;
        stopBtn.disabled = true;
    };

    downloadBtn.onclick = () => {
        if (finalVideoUrl) {
            const a = document.createElement('a');
            a.href = finalVideoUrl;
            a.download = 'LIC_Agent_Final.webm';
            a.click();
        }
    };
</script>
</body>
</html>

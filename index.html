<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Video Editor - 9959041086</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f5; padding: 10px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        canvas { border: 3px solid #004aad; border-radius: 10px; background: #000; width: 100%; height: auto; margin-top: 10px; }
        .status { padding: 10px; margin-bottom: 10px; font-weight: bold; border-radius: 5px; font-size: 14px; }
        .loading { background: #fff3cd; color: #856404; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 12px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; }
        #startBtn { background: #004aad; color: white; }
        #stopBtn { background: #dc3545; color: white; }
        #downloadBtn { background: #28a745; color: white; display: none; }
        button:disabled { background: #ccc !important; }
    </style>
</head>
<body>

<div class="container">
    <div id="status" class="status loading">గూగుల్ షీట్ డేటా కోసం ప్రయత్నిస్తున్నాము...</div>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <button id="startBtn" disabled>▶ రికార్డింగ్ ప్రారంభించండి</button>
        <button id="stopBtn" disabled>⏹ ఆపు</button>
        <button id="downloadBtn">📥 వీడియో డౌన్‌లోడ్</button>
    </div>
</div>

<video id="videoPlayer" style="display: none;" crossorigin="anonymous" playsinline muted></video>

<script>
    const player = document.getElementById('videoPlayer');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let watermarkImg = new Image();
    let mediaRecorder;
    let recordedChunks = [];
    let isScrolling = false;
    let scrollY = 0;
    let mainSrc = "video.mp4";
    let outroSrc = "";
    let isOutro = false;

    // మీ గూగుల్ షీట్ లింక్
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReHcj4b9ZAKFQxhMyXFZ_sQQsQHYlyhuPpxr1FmwGXsGRuFhcyUTcP3SeIsmLL04fXfS56feC3Hsoq/pub?gid=0&single=true&output=csv";
    const targetMobile = "9959041086";

    async function loadAgent() {
        try {
            const resp = await fetch(sheetUrl + "&cache=" + Date.now());
            const text = await resp.text();
            const rows = text.split("\n");
            
            let imgLink = "";
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(",");
                if (cols[0] && cols[0].replace(/\D/g, '') === targetMobile) {
                    imgLink = cols[1]?.trim();
                    outroSrc = cols[2]?.trim();
                    break;
                }
            }

            if (imgLink && outroSrc) {
                watermarkImg.crossOrigin = "anonymous";
                watermarkImg.src = imgLink;
                watermarkImg.onload = () => {
                    statusDiv.className = "status success";
                    statusDiv.innerText = "ఏజెంట్ వివరాలు దొరికాయి! రికార్డింగ్ ప్రారంభించవచ్చు.";
                    startBtn.disabled = false;
                    player.src = mainSrc;
                    player.load();
                };
            } else {
                statusDiv.className = "status error";
                statusDiv.innerText = "షీట్‌లో 9959041086 కి వివరాలు లేవు!";
            }
        } catch (e) {
            statusDiv.className = "status error";
            statusDiv.innerText = "షీట్ లోడ్ అవ్వలేదు!";
        }
    }

    loadAgent();

    player.onloadedmetadata = () => {
        canvas.width = player.videoWidth;
        canvas.height = player.videoHeight;
        scrollY = canvas.height;
    };

    function draw() {
        if (player.paused || player.ended) return;
        ctx.drawImage(player, 0, 0, canvas.width, canvas.height);

        if (!isOutro && watermarkImg.complete) {
            let w = canvas.width * 0.98;
            let h = (watermarkImg.height / watermarkImg.width) * w;
            ctx.drawImage(watermarkImg, (canvas.width - w) / 2, scrollY, w, h);
            if (isScrolling) {
                scrollY -= 2;
                if (scrollY + h < 0) scrollY = canvas.height;
            }
        }
        requestAnimationFrame(draw);
    }

    startBtn.onclick = () => {
        isOutro = false;
        scrollY = canvas.height;
        isScrolling = true;
        recordedChunks = [];
        
        player.src = mainSrc;
        player.muted = false;
        player.play();
        draw();

        const stream = canvas.captureStream(30);
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 5000000 });
        mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            downloadBtn.href = URL.createObjectURL(blob);
            downloadBtn.style.display = "inline-block";
        };
        mediaRecorder.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
    };

    player.onended = () => {
        if (!isOutro) {
            isOutro = true;
            isScrolling = false;
            player.src = outroSrc;
            player.play().catch(() => {
                // ఒకవేళ ఆటో-ప్లే బ్లాక్ అయితే రికార్డింగ్ ఆపేయాలి
                stopBtn.click();
            });
        } else {
            stopBtn.click();
        }
    };

    stopBtn.onclick = () => {
        player.pause();
        if (mediaRecorder.state !== "inactive") mediaRecorder.stop();
        startBtn.disabled = false;
        stopBtn.disabled = true;
    };

    downloadBtn.onclick = (e) => {
        const a = document.createElement('a');
        a.href = e.target.href;
        a.download = 'Agent_Video_Final.webm';
        a.click();
        return false;
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Video Maker - 9959041086</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        canvas { border: 3px solid #004aad; border-radius: 10px; background-color: #000; max-width: 100%; height: auto; margin-top: 15px; }
        .status-box { padding: 15px; margin: 10px 0; font-weight: bold; border-radius: 8px; font-size: 18px; }
        .loading { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        button { padding: 12px 25px; margin: 10px 5px; cursor: pointer; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; }
        #startBtn { background: #004aad; color: white; }
        #stopBtn { background: #dc3545; color: white; }
        #downloadBtn { background: #28a745; color: white; display: none; }
        button:disabled { background: #ccc !important; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>LIC వీడియో ఎడిటర్ - ఏజెంట్ పోర్టల్</h2>
    <div id="status" class="status-box loading">డేటా కోసం ప్రయత్నిస్తున్నాము...</div>

    <canvas id="canvas"></canvas>

    <div class="controls">
        <button id="startBtn" disabled>▶ రికార్డింగ్ ప్రారంభించండి</button>
        <button id="stopBtn" disabled>⏹ ఆపు</button>
        <button id="downloadBtn">📥 వీడియో డౌన్‌లోడ్ చేయండి</button>
    </div>
</div>

<video id="mainVideo" src="video.mp4" style="display: none;" crossorigin="anonymous" playsinline></video>
<video id="outroVideo" style="display: none;" crossorigin="anonymous" playsinline></video>

<script>
    const mainVideo = document.getElementById('mainVideo');
    const outroVideo = document.getElementById('outroVideo');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusDiv = document.getElementById('status');

    let watermarkImage = new Image();
    let mediaRecorder;
    let recordedChunks = [];
    let watermarkScrollY = 0;
    let isScrolling = false;
    let finalVideoUrl = null;
    let currentVideo = mainVideo;

    // మీ గూగుల్ షీట్ లింక్ (ముఖ్య గమనిక: చివరన output=csv ఉండాలి)
    const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReHcj4b9ZAKFQxhMyXFZ_sQQsQHYlyhuPpxr1FmwGXsGRuFhcyUTcP3SeIsmLL04fXfS56feC3Hsoq/pub?gid=0&single=true&output=csv";
    
    // మీరు కోరిన మొబైల్ నంబర్
    const loginMobile = "9959041086"; 

    async function loadAgentData() {
        try {
            // బ్రౌజర్ బ్లాక్ చేయకుండా ఉండటానికి 'no-cache' మరియు రిక్వెస్ట్ మోడ్ మార్చాను
            const response = await fetch(sheetCSVUrl, { cache: "no-store" });
            const csvData = await response.text();
            
            if (!csvData || csvData.includes("<!DOCTYPE html>")) {
                throw new Error("CSV డేటా రాలేదు. షీట్ పబ్లిష్ సెట్టింగ్స్ చూడండి.");
            }

            const rows = csvData.split("\n");
            let imageUrl = "";
            let outroUrl = "";

            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(",");
                if (cols[0]) {
                    const sheetMobile = cols[0].replace(/\D/g, '').trim();
                    if (sheetMobile === loginMobile) {
                        imageUrl = cols[1] ? cols[1].trim() : "";
                        outroUrl = cols[2] ? cols[2].trim() : "";
                        break;
                    }
                }
            }

            if (imageUrl && outroUrl) {
                // ఇమేజ్ సెటప్
                watermarkImage.crossOrigin = "anonymous";
                watermarkImage.src = imageUrl;

                // అవుట్రో వీడియో సెటప్
                outroVideo.src = outroUrl;
                outroVideo.load();

                watermarkImage.onload = () => {
                    statusDiv.className = "status-box success";
                    statusDiv.innerText = "9959041086 వివరాలు దొరికాయి! రికార్డింగ్ ప్రారంభించవచ్చు.";
                    startBtn.disabled = false;
                    watermarkScrollY = canvas.height;
                };
            } else {
                statusDiv.className = "status-box error";
                statusDiv.innerText = "షీట్‌లో ఈ నంబర్ వివరాలు లేవు! (నంబర్: " + loginMobile + ")";
            }
        } catch (e) {
            statusDiv.className = "status-box error";
            statusDiv.innerText = "షీట్ లోడ్ అవ్వడం లేదు! మీ గూగుల్ షీట్ లో 'Publish to Web' మళ్ళీ ఒకసారి చేయండి.";
            console.error(e);
        }
    }

    loadAgentData();

    mainVideo.onloadedmetadata = () => {
        canvas.width = mainVideo.videoWidth;
        canvas.height = mainVideo.videoHeight;
        watermarkScrollY = canvas.height;
    };

    function draw() {
        if (currentVideo.paused || currentVideo.ended) return;
        ctx.drawImage(currentVideo, 0, 0, canvas.width, canvas.height);

        if (currentVideo === mainVideo && watermarkImage.src) {
            let wWidth = canvas.width * 0.98;
            let wHeight = (watermarkImage.height / watermarkImage.width) * wWidth;
            let xPos = (canvas.width - wWidth) / 2;
            ctx.drawImage(watermarkImage, xPos, watermarkScrollY, wWidth, wHeight);
            
            if (isScrolling) {
                watermarkScrollY -= 2.2;
                if (watermarkScrollY + wHeight < 0) watermarkScrollY = canvas.height;
            }
        }
        requestAnimationFrame(draw);
    }

    startBtn.onclick = () => {
        recordedChunks = [];
        downloadBtn.style.display = "none";
        isScrolling = true;
        currentVideo = mainVideo;
        mainVideo.play();
        draw();

        const canvasStream = canvas.captureStream(30);
        const vStream = mainVideo.captureStream ? mainVideo.captureStream() : mainVideo.mozCaptureStream();
        if (vStream.getAudioTracks().length > 0) canvasStream.addTrack(vStream.getAudioTracks()[0]);

        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 6000000 });
        mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            finalVideoUrl = URL.createObjectURL(blob);
            downloadBtn.style.display = "inline-block";
        };

        mediaRecorder.start();
        startBtn.disabled = true; stopBtn.disabled = false;
    };

    mainVideo.onended = () => {
        isScrolling = false;
        currentVideo = outroVideo;
        outroVideo.play();
        draw();
    };

    outroVideo.onended = () => {
        if(!stopBtn.disabled) stopBtn.onclick();
    };

    stopBtn.onclick = () => {
        mainVideo.pause(); outroVideo.pause();
        if(mediaRecorder) mediaRecorder.stop();
        startBtn.disabled = false; stopBtn.disabled = true;
    };

    downloadBtn.onclick = () => {
        if (finalVideoUrl) {
            const a = document.createElement('a');
            a.href = finalVideoUrl; a.download = 'LIC_9959041086_Video.webm'; a.click();
        }
    };
</script>
</body>
</html>

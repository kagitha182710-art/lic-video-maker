<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Video Maker - 15 Video Gallery</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f5; padding: 10px; -webkit-user-select: none; user-select: none; }
        .container { max-width: 450px; margin: auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        
        /* వీడియో సెలెక్టర్ గ్రిడ్ */
        .video-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            margin-bottom: 20px; 
            max-height: 200px; 
            overflow-y: auto; 
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fdfdfd;
        }
        .v-btn { 
            padding: 8px 5px; 
            font-size: 11px; 
            background: #eef2f7; 
            border: 1px solid #004aad; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold;
            color: #004aad;
            transition: 0.3s;
        }
        .v-btn.active { background: #004aad; color: #fff; }
        
        canvas { border: 2px solid #ccc; border-radius: 10px; background: #fff; width: 100%; height: auto; display: block; margin: auto; }
        .status-box { padding: 10px; margin-bottom: 10px; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .success { background: #d4edda; color: #155724; }
        .loading { background: #fff3cd; color: #856404; }
        .recording { background: #ffeeba; color: #d39e00; }
        
        .main-btns { margin-top:15px; display: flex; justify-content: center; gap: 10px; }
        #startBtn { background: #004aad; color: #fff; padding: 12px 20px; border-radius: 8px; border:none; font-weight:bold; cursor:pointer;}
        #stopBtn { background: #d93025; color: #fff; padding: 12px 20px; border-radius: 8px; border:none; font-weight:bold; cursor:pointer;}
        #downloadBtn { background: #1e8e3e; color: #fff; display: none; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight:bold;}
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <h3 style="color:#004aad; margin-bottom:10px;">వీడియోను ఎంచుకోండి (1-15)</h3>
    
    <!-- 15 వీడియోల బటన్లు -->
    <div class="video-grid" id="gallery">
        <!-- ఇక్కడ మీరు మీ 15 వీడియోల పేర్లు మార్చుకోవచ్చు -->
        <button class="v-btn active" onclick="changeVideo('today.mp4', this)">న్యూస్ యాంకర్</button>
        <button class="v-btn" onclick="changeVideo('video2.mp4', this)">జీవన్ ఉమంగ్</button>
        <button class="v-btn" onclick="changeVideo('video3.mp4', this)">జీవన్ ఆనంద్</button>
        <button class="v-btn" onclick="changeVideo('video4.mp4', this)">రిటైర్మెంట్</button>
        <button class="v-btn" onclick="changeVideo('video5.mp4', this)">పిల్లల చదువు</button>
        <button class="v-btn" onclick="changeVideo('video6.mp4', this)">కన్యాదాన్</button>
        <button class="v-btn" onclick="changeVideo('video7.mp4', this)">మనీ బ్యాక్</button>
        <button class="v-btn" onclick="changeVideo('video8.mp4', this)">టర్మ్ ప్లాన్</button>
        <button class="v-btn" onclick="changeVideo('video9.mp4', this)">ఆరోగ్య భీమా</button>
        <button class="v-btn" onclick="changeVideo('video10.mp4', this)">హోలీ విషెస్</button>
        <button class="v-btn" onclick="changeVideo('video11.mp4', this)">సంక్రాంతి</button>
        <button class="v-btn" onclick="changeVideo('video12.mp4', this)">దీపావళి</button>
        <button class="v-btn" onclick="changeVideo('video13.mp4', this)">న్యూ ఇయర్</button>
        <button class="v-btn" onclick="changeVideo('video14.mp4', this)">బర్త్ డే</button>
        <button class="v-btn" onclick="changeVideo('video15.mp4', this)">యానివర్సరీ</button>
    </div>

    <div id="status" class="status-box loading">వీడియో లోడ్ అవుతోంది...</div>
    <canvas id="canvas"></canvas>
    
    <div class="main-btns">
        <button id="startBtn" disabled>▶ రికార్డింగ్ ప్రారంభించు</button>
        <button id="stopBtn" disabled>⏹ ఆపు</button>
    </div>
    <div style="margin-top:15px;">
        <a id="downloadBtn" href="#">📥 వీడియో డౌన్‌లోడ్ చేయండి</a>
    </div>
</div>

<video id="vPlayer" style="display:none;" playsinline crossorigin="anonymous"></video>

<script>
    const v = document.getElementById('vPlayer');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let fixedImg = new Image();
    let borderImg = new Image();
    let recorder, chunks = [];
    
    let waterName = "";
    let agentMob = "";
    let nameX = 50, nameY = 80, mobX = 100, mobY = 200;
    let lastUpdate = 0;

    let borderSrc = "TRASPARENT BACKROUND.png"; 
    let outroSrc = "";
    
    let isOutro = false, audioCtx, dest, source;

    const sheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReHcj4b9ZAKFQxhMyXFZ_sQQsQHYlyhuPpxr1FmwGXsGRuFhcyUTcP3SeIsmLL04fXfS56feC3Hsoq/pub?gid=0&single=true&output=csv";
    const agentMobile = "9959041086";

    // వీడియో మార్చే ఫంక్షన్
    function changeVideo(newSrc, btn) {
        // బటన్ కలర్ మార్చడానికి
        document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        startBtn.disabled = true;
        downloadBtn.style.display = "none";
        status.className = "status-box loading";
        status.innerText = "లోడ్ అవుతోంది...";
        
        v.src = newSrc + "?v=" + Date.now();
        v.load();
    }

    async function loadData() {
        try {
            const r = await fetch(sheet + "&cb=" + Date.now());
            const text = await r.text();
            const rows = text.split("\n");
            let fSrc = "";
            
            for (let i = 0; i < rows.length; i++) {
                let cols = rows[i].split(",");
                if (cols[0] && cols[0].trim().includes(agentMobile)) {
                    agentMob = cols[0]?.trim(); 
                    waterName = cols[4]?.trim() || ""; 
                    fSrc = cols[1]?.trim(); 
                    outroSrc = cols[2]?.trim(); 
                    break;
                }
            }

            let loadPromises = [];
            loadPromises.push(new Promise(res => { borderImg.onload = res; borderImg.src = borderSrc; }));
            if (fSrc) {
                fixedImg.crossOrigin = "anonymous";
                loadPromises.push(new Promise(res => { fixedImg.onload = res; fixedImg.src = fSrc; }));
            }

            await Promise.all(loadPromises);
            
            // మొదటి వీడియో (Default) లోడ్ చేయడం
            v.src = "today.mp4?v=" + Date.now();
            v.load();
            
        } catch (e) { status.innerText = "డేటా లోడ్ అవ్వలేదు!"; }
    }

    loadData();

    v.onloadedmetadata = () => {
        canvas.width = v.videoWidth;
        canvas.height = v.videoHeight;
    };

    v.onloadeddata = () => {
        render();
        status.className = "status-box success";
        status.innerText = "వీడియో సిద్ధంగా ఉంది!";
        startBtn.disabled = false;
    };

    function render() {
        let w = canvas.width;
        let h = canvas.height;

        if (v.readyState >= 2) {
            ctx.drawImage(v, 0, 0, w, h);
        } else {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);
        }

        if (!v.paused && !v.ended) {
            let now = Date.now();
            if (now - lastUpdate > 4000) { 
                nameX = Math.random() * (w - 200) + 30;
                nameY = Math.random() * (h/2 - 100) + 100;
                mobX = Math.random() * (w - 200) + 30;
                mobY = Math.random() * (h/2 - 100) + (h/2);
                lastUpdate = now;
            }
            
            ctx.save();
            ctx.globalAlpha = 0.5;
            ctx.shadowBlur = 4;
            ctx.shadowColor = "black";
            
            ctx.font = "bold 24px Segoe UI";
            ctx.fillStyle = "#FFD700";
            if(waterName) {
                ctx.fillText("👤", nameX - 30, nameY);
                ctx.fillStyle = "white";
                ctx.fillText(waterName, nameX, nameY); 
            }
            
            ctx.font = "bold 22px Segoe UI";
            ctx.fillStyle = "#25D366";
            ctx.fillText("📞", mobX - 30, mobY);
            ctx.fillStyle = "white";
            ctx.fillText(agentMob, mobX, mobY);
            
            ctx.restore();
        }

        if (fixedImg.complete) {
            let targetWidth = w * 0.95; 
            let fH = ((fixedImg.height / fixedImg.width) * targetWidth) * 0.85; 
            let xOffset = (w - targetWidth) / 2; 
            let yOffset = 20; 
            ctx.drawImage(fixedImg, xOffset, h - fH - yOffset, targetWidth, fH);
        }

        if (borderImg.complete) {
            ctx.drawImage(borderImg, 0, 0, w, h);
        }
    }

    function loop() {
        if (!v.paused && !v.ended) {
            render();
            requestAnimationFrame(loop);
        }
    }
    v.addEventListener('play', loop);

    startBtn.onclick = async () => {
        try {
            startBtn.disabled = true;
            status.className = "status-box recording";
            status.innerText = "రికార్డింగ్ జరుగుతోంది...";

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                dest = audioCtx.createMediaStreamDestination();
                source = audioCtx.createMediaElementSource(v);
                source.connect(dest);
                source.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            chunks = []; 
            isOutro = false;
            v.currentTime = 0; 
            await v.play(); 

            const stream = canvas.captureStream(30);
            const combined = new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]);

            recorder = new MediaRecorder(combined, { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 2500000 });
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                downloadBtn.href = URL.createObjectURL(blob);
                downloadBtn.download = "LIC_Video.webm";
                downloadBtn.style.display = "inline-block";
                status.innerText = "వీడియో సిద్ధమైంది!";
            };
            recorder.start();
            stopBtn.disabled = false;
        } catch (e) { alert(e.message); }
    };

    v.onended = () => {
        if (!isOutro && outroSrc) {
            isOutro = true;
            v.src = outroSrc;
            v.play();
        } else { stopBtn.click(); }
    };

    stopBtn.onclick = () => {
        v.pause();
        if (recorder && recorder.state !== "inactive") recorder.stop();
        startBtn.disabled = false; stopBtn.disabled = true;
    };

    // సెక్యూరిటీ
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = e => {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) return false;
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Scrolling Watermark Editor</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 20px; background-color: #f4f4f9;}
        canvas { border: 2px solid #333; border-radius: 8px; margin-top: 15px; background-color: #000; max-width: 100%; max-height: 60vh; object-fit: contain;}
        button { padding: 10px 15px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px;}
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h2>LIC వీడియో ఎడిటర్ - స్క్రోలింగ్ వాటర్ మార్క్</h2>
    
    <div style="margin-bottom: 15px;">
        <label><b>వాటర్ మార్క్ (విజిటింగ్ కార్డ్) అప్లోడ్ చేయండి: </b></label>
        <input type="file" id="imageUpload" accept="image/*" />
    </div>

    <canvas id="canvas"></canvas><br>

    <div class="controls">
        <button id="startBtn">▶ ప్లే & రికార్డింగ్ స్టార్ట్</button>
        <button id="stopBtn" disabled>⏹ స్టాప్ & డౌన్‌లోడ్</button>
    </div>

    <!-- వీడియో ఫైల్ పేరు కచ్చితంగా video.mp4 అని ఉండాలి -->
    <video id="video" src="video.mp4" style="display: none;" crossorigin="anonymous"></video>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        let watermarkImage = new Image();
        let mediaRecorder;
        let recordedChunks = [];
        let watermarkScrollY = 0;
        let isScrolling = false;

        // 1. ఇమేజ్ అప్లోడ్ చేయగానే లోడ్ చేయడం
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    watermarkImage.src = event.target.result;
                    watermarkImage.onload = () => {
                        // ఇమేజ్ లోడ్ అవ్వగానే కాన్వాస్ అడుగున పొజిషన్ సెట్ చేయడం
                        watermarkScrollY = canvas.height;
                        renderStaticFrame(); // ప్రివ్యూ కోసం
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        video.addEventListener('loadedmetadata', function() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            watermarkScrollY = canvas.height;
        });

        // రికార్డింగ్ స్టార్ట్ చేయకముందు కూడా ఇమేజ్ కనిపించడానికి
        function renderStaticFrame() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            drawWatermark();
        }

        function drawWatermark() {
            if (watermarkImage.src) {
                // ఇమేజ్ క్వాలిటీ తగ్గకుండా దాని వెడల్పును బట్టి హైట్ లెక్కించడం
                let wWidth = canvas.width * 0.3; // వీడియో వెడల్పులో 30% సైజు
                let wHeight = (watermarkImage.height / watermarkImage.width) * wWidth;
                let xPos = canvas.width - wWidth - 20; // కుడివైపు చివరన

                ctx.globalAlpha = 1.0; // పూర్తి క్వాలిటీ కోసం
                ctx.drawImage(watermarkImage, xPos, watermarkScrollY, wWidth, wHeight);
                
                if (isScrolling) {
                    watermarkScrollY -= 1.5; // స్క్రోలింగ్ స్పీడ్ (మెల్లగా పైకి వెళ్తుంది)
                    if (watermarkScrollY + wHeight < 0) {
                        watermarkScrollY = canvas.height; // మళ్ళీ కింద నుండి రావడానికి
                    }
                }
            }
        }

        function draw() {
            if (video.paused || video.ended) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            drawWatermark();
            requestAnimationFrame(draw);
        }

        startBtn.addEventListener('click', () => {
            if (!watermarkImage.src) {
                alert("ముందుగా వాటర్ మార్క్ ఇమేజ్ సెలెక్ట్ చేయండి!");
                return;
            }
            isScrolling = true;
            video.play();
            draw();

            const canvasStream = canvas.captureStream(30);
            let videoStream = video.captureStream ? video.captureStream() : video.mozCaptureStream();

            if (videoStream && videoStream.getAudioTracks().length > 0) {
                canvasStream.addTrack(videoStream.getAudioTracks()[0]);
            }

            mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
            recordedChunks = [];
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.start();
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
        });

        stopBtn.addEventListener('click', () => {
            video.pause();
            isScrolling = false;
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'lic-scrolling-video.webm';
                a.click();
            };
        });

        video.addEventListener('ended', () => { if(!stopBtn.disabled) stopBtn.click(); });
    </script>
</body>
</html>
